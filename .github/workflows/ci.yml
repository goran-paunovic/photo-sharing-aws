name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend · Maven verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress --file backend/pom.xml clean verify

  lambda:
    name: Thumbnail Lambda · Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: lambdas/thumbnail-generator/requirements-dev.txt

      - name: Install dependencies
        working-directory: lambdas/thumbnail-generator
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: lambdas/thumbnail-generator
        run: python -m pytest --strict-markers --strict-config -q

      - name: Compile Python sources
        working-directory: lambdas/thumbnail-generator
        run: python -m compileall -q handler.py tests

  infrastructure:
    name: Infrastructure · compile and synthesize
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Compile CDK application
        working-directory: infrastructure
        run: npm run build

      - name: Synthesize CloudFormation templates
        working-directory: infrastructure
        run: npx cdk synth
